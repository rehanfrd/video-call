name: Build ZingCall APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6' 
        channel: 'stable'
    
    - name: Setup Android & Permissions
      run: |
        rm -rf android
        flutter create --project-name zing_call --platforms android .
        
        # 🔥 1. Advance Fix for Kotlin Version (Forces 1.9.24 no matter what old version is there)
        sed -i -E 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/g' android/settings.gradle
        
        # 🔥 2. Advance Fix for minSdk 21 (Catches all possible flutter formats)
        sed -i -E 's/flutter\.minSdkVersion|minSdk = .*/minSdk = 21/g' android/app/build.gradle
        sed -i -E 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
        
        # 🔥 3. Inject Camera & Mic Permissions directly below <manifest> tag
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' android/app/src/main/AndroidManifest.xml

    - run: flutter pub get
    - run: flutter build apk --release --no-tree-shake-icons
    
    - uses: actions/upload-artifact@v4
      with:
        name: ZingCall-App
        path: build/app/outputs/flutter-apk/app-release.apk
