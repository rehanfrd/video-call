name: Build ZingCall APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Clean & Recreate Android
      run: |
        rm -rf android
        flutter create --project-name zing_call --platforms android .

    - name: Fix Kotlin, AGP & MinSDK
      run: |
        # 🔥 Kotlin 2.1.0 Fix
        sed -i "s/ext.kotlin_version = '1.7.1'/ext.kotlin_version = '2.1.0'/g" android/build.gradle || true
        sed -i 's/version "1.7.1"/version "2.1.0"/g' android/settings.gradle || true
        
        # 🔥 AGP 7.3.1 Fix (Jo Kotlin 2.1.0 ko support karta hai)
        sed -i "s/gradle:7.3.0/gradle:7.3.1/g" android/build.gradle || true
        sed -i 's/version "7.3.0"/version "7.3.1"/g' android/settings.gradle || true
        
        # 🔥 MinSDK 21 Fix
        sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

    - name: Add Permissions
      run: |
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml

    - run: flutter pub get

    - name: NUKE JCenter 
      run: find ~/.pub-cache/hosted/pub.dev/ -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

    - run: flutter build apk --release --no-tree-shake-icons

    - uses: actions/upload-artifact@v4
      with:
        name: ZingCall-App
        path: build/app/outputs/flutter-apk/app-release.apk
