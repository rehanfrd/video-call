name: Build ZingCall APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Clean & Recreate Android
      run: |
        rm -rf android
        flutter create --project-name zing_call --platforms android .

    - name: 🔥 BULLETPROOF FIX: Kotlin, AGP & MinSDK
      run: |
        # 1. Update AGP to 7.4.2 (Safely supports new Kotlin)
        sed -i -E 's/(id "com.android.application" version ")[0-9\.]+(")/\17.4.2\2/' android/settings.gradle || true
        
        # 2. Update Kotlin to 2.1.0 (Fixes is_lock_screen2 crash)
        sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[0-9\.]+(")/\12.1.0\2/' android/settings.gradle || true
        sed -i -E "s/(ext.kotlin_version = ')[0-9\.]+(')/\12.1.0\2/" android/build.gradle || true
        
        # 3. Minimum SDK 21
        sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

    - name: Add Permissions
      run: |
        perl -0777 -pi -e 's/<\/manifest>/\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n<\/manifest>/g' android/app/src/main/AndroidManifest.xml

    - run: flutter pub get

    - name: NUKE JCenter 
      run: find ~/.pub-cache/hosted/pub.dev/ -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

    - run: flutter build apk --release --no-tree-shake-icons

    - uses: actions/upload-artifact@v4
      with:
        name: ZingCall-App
        path: build/app/outputs/flutter-apk/app-release.apk
        
