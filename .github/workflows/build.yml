name: Build ZingCall APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Clean & Recreate Android
      run: |
        rm -rf android
        flutter create --project-name zing_call --platforms android .

    - name: Fix Android Configs for ZegoCloud (Supports both Gradle & KTS)
      run: |
        # Fix minSdk, compileSdk, aur targetSdk saari files mein
        find android -name "build.gradle*" -type f -exec sed -i 's/flutter.minSdkVersion/21/g' {} + || true
        find android -name "build.gradle*" -type f -exec sed -i 's/flutter.compileSdkVersion/34/g' {} + || true
        find android -name "build.gradle*" -type f -exec sed -i 's/flutter.targetSdkVersion/34/g' {} + || true
        
        # Fix Kotlin version saari settings files mein
        find android -name "settings.gradle*" -type f -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.0"/g' {} + || true
        find android -name "settings.gradle*" -type f -exec sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.0"/g' {} + || true
        find android -name "build.gradle*" -type f -exec sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/g' {} + || true

    - name: Add Safe Permissions
      run: |
        perl -0777 -pi -e 's/<\/manifest>/\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n<\/manifest>/g' android/app/src/main/AndroidManifest.xml

    - run: flutter pub get

    - name: Fix Missing Namespaces in Pub Cache
      run: |
        for manifest in $(find ~/.pub-cache/hosted/pub.dev/ -name AndroidManifest.xml); do
          android_dir=$(echo "$manifest" | sed 's|/src/main/AndroidManifest.xml||')
          build_gradle="$android_dir/build.gradle"
          if [ -f "$build_gradle" ] && ! grep -q "namespace" "$build_gradle"; then
            pkg=$(grep -oP 'package="\K[^"]+' "$manifest" | head -n 1)
            if [ -n "$pkg" ]; then
              echo "" >> "$build_gradle"
              echo "android { namespace '$pkg' }" >> "$build_gradle"
            fi
          fi
        done

    - name: Fix JCenter References
      run: find ~/.pub-cache/hosted/pub.dev/ -name "*.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} + || true

    - run: flutter build apk --release --no-tree-shake-icons

    - uses: actions/upload-artifact@v4
      with:
        name: ZingCall-App
        path: build/app/outputs/flutter-apk/app-release.apk
